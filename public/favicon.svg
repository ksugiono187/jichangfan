<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="airplaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" /> <!-- amber-500 -->
      <stop offset="100%" stop-color="#B45309" /> <!-- amber-700 -->
